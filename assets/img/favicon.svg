<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Robot head body -->
  <rect x="4" y="8" width="24" height="20" rx="3" ry="3" fill="#58a6ff"/>
  
  <!-- Antenna -->
  <line x1="16" y1="8" x2="16" y2="3" stroke="#58a6ff" stroke-width="2" stroke-linecap="round"/>
  <circle cx="16" cy="2" r="2" fill="#58a6ff"/>
  
  <!-- Screen face (black) -->
  <rect x="7" y="11" width="18" height="14" rx="2" ry="2" fill="#0d1117"/>
  
  <!-- White eyes -->
  <circle cx="11" cy="17" r="2.5" fill="white"/>
  <circle cx="21" cy="17" r="2.5" fill="white"/>
  
  <!-- White smile -->
  <path d="M11 22 Q16 26 21 22" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <!-- Ears/side details -->
  <rect x="1" y="14" width="3" height="6" rx="1" fill="#58a6ff"/>
  <rect x="28" y="14" width="3" height="6" rx="1" fill="#58a6ff"/>
</svg>
